<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0a11">
<title>Health Game - Host</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/tutorial.css">
</head>
<body class="host">
  <header id="bar" class="bar hidden">
    <span id="bar-code" class="code"></span>
    <span id="round" class="round"></span>
    <span id="phase" class="phase"></span>
    <span id="timer" class="timer"></span>
    <span id="game-clock" class="game-clock hidden"></span>
    <button id="close-bar" class="btn btn-mini btn-ghost">ปิดห้อง</button>
  </header>

  <section id="lobby" class="screen lobby lobby-host">
    <div class="sign sign-qr">
      <div class="sign-main">
        <span class="sign-label">รหัสห้อง · กด "เข้าร่วมเกม" แล้วใส่รหัส</span>
        <div id="lobby-code" class="lobby-code"></div>
      </div>
      <div class="qr-box">
        <canvas id="join-qr" class="join-qr" aria-label="QR เข้าห้อง"></canvas>
        <span class="qr-label">สแกนเข้าห้อง</span>
      </div>
    </div>
    <div class="lobby-grid">
      <div class="hall">
        <div class="hall-head"><h1 class="lobby-title">ผู้กล้าในห้อง</h1><span id="player-count" class="count-pill"></span></div>
        <ul id="player-list" class="lobby-players"></ul>
      </div>
      <aside class="scroll-panel">
        <h2 class="panel-title">ตั้งค่าเกม</h2>
        <div class="setting">
          <span class="setting-label">1. คำถาม</span>
          <label class="btn btn-mini file-btn" for="file">📜 อัปโหลด .xlsx</label>
          <input id="file" type="file" accept=".xlsx" hidden>
          <span id="q-summary" class="setting-value">ยังไม่มีคำถาม</span>
        </div>
        <div class="setting">
          <span class="setting-label">2. เวลาเล่นทั้งเกม</span>
          <div id="time-choices" class="chips"></div>
        </div>
        <div class="setting">
          <span class="setting-label">3. เวลาตอบต่อข้อ</span>
          <div id="answer-choices" class="chips"></div>
          <span id="time-summary" class="setting-value"></span>
        </div>
        <button id="start" class="btn btn-primary btn-big" disabled>⚔ เริ่มเกม</button>
        <p id="hint" class="hint"></p>
        <div class="panel-foot">
          <button id="tutorial-open" class="btn btn-mini">วิธีเล่น</button>
          <button id="close-lobby" class="btn btn-mini btn-ghost">ปิดห้อง</button>
        </div>
      </aside>
    </div>
  </section>

  <div class="host-layout">
    <section id="board" class="board hidden">
      <div id="stage"></div>
    </section>
    <section id="host-quiz" class="host-quiz hidden">
      <div class="hq-head"><span class="hq-label">คำถามรอบนี้</span><span id="hq-count" class="hq-count"></span></div>
      <p id="hq-text" class="hq-text"></p>
      <ol id="hq-choices" class="hq-choices"></ol>
    </section>
  </div>

  <section id="gameover" class="gameover hidden">
    <div class="go-inner">
      <div id="go-fx" class="go-fx"></div>
      <h1 id="go-title" class="go-title"></h1>
      <p id="go-reveal" class="go-reveal"></p>
      <div id="go-board-wrap" class="go-board-wrap hidden">
        <h2 class="go-sub">ตารางคะแนน</h2>
        <p id="go-mvp" class="go-mvp"></p>
        <ol id="go-board" class="go-board"></ol>
        <p class="go-note">เรียงตามจำนวนข้อที่ตอบถูก · ถ้าเท่ากัน ใช้เวลาตอบรวมน้อยกว่าชนะ</p>
      </div>
      <h2 id="go-survivors-head" class="go-sub">ผู้รอดชีวิต</h2>
      <ul id="go-survivors" class="go-survivors"></ul>
      <button id="close-over" class="btn btn-primary">ปิดห้อง</button>
    </div>
  </section>

  <div id="blackout" class="blackout-veil"></div>
  <script type="module" src="js/host.js"></script>
  <script type="module">import { mountDecor } from './js/pixelDecor.js'; import { Backdrop } from './js/backdrop.js'; mountDecor(); new Backdrop();</script>
</body>
</html>
