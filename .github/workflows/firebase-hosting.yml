# Deploys the site to Firebase Hosting (https://healthgame-2b63b.web.app) on every
# push to main, or by hand from the Actions tab ("Run workflow").
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT_HEALTHGAME_2B63B
# (the JSON key from Firebase Console -> Project settings -> Service accounts).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEALTHGAME_2B63B }}
          channelId: live
          projectId: healthgame-2b63b
