# Deploys the site (and the database rules) to Firebase Hosting (https://healthgame-2b63b.web.app) on every
# push to main, or by hand from the Actions tab ("Run workflow").
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT_HEALTHGAME_2B63B
# (the JSON key from Firebase Console -> Project settings -> Service accounts).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stamp the commit into every relative module/CSS URL, so a browser holding
      # an older cached copy can never mix old and new files after a deploy.
      - name: Version asset URLs
        run: |
          V="${GITHUB_SHA::7}"
          find js -name '*.js' -print0 | xargs -0 sed -i -E "s#(from[[:space:]]*['\"]\.{1,2}/[^'\"?]+\.js)(['\"])#\1?v=$V\2#g"
          sed -i -E "s#((src|href)=\"(js|css)/[^\"?]+\.(js|css))\"#\1?v=$V\"#g; s#(from[[:space:]]*'\./js/[^'?]+\.js)'#\1?v=$V'#g" *.html
          grep -c "?v=$V" index.html host.html game.html js/host.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEALTHGAME_2B63B }}
          channelId: live
          projectId: healthgame-2b63b
      # Database security rules (database.rules.json) with the same service account.
      - name: Deploy database rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEALTHGAME_2B63B }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only database --project healthgame-2b63b --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
