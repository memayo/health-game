<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Health Game</title>
<meta name="theme-color" content="#0c0a11">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="home">

  <main id="view-home" class="screen">
    <div class="home-title">
      <div class="torch-slot" data-pixelfx="fire/torch" data-box="16,40" data-scale="2" data-opts='{"seed":4,"light":0.6}'></div>
      <h1 class="logo"><span class="logo-main">HEALTH<br>GAME</span><span class="logo-sub">DUNGEON QUIZ</span></h1>
      <div class="torch-slot" data-pixelfx="fire/torch" data-box="16,40" data-scale="2" data-opts='{"seed":9,"light":0.6}'></div>
    </div>
    <div class="stack">
      <button id="btn-host" class="btn btn-primary">Host</button>
      <button id="btn-join" class="btn">Join</button>
    </div>
    <p id="msg-home" class="msg"></p>
  </main>

  <main id="view-join" class="screen hidden">
    <form id="join-form" class="stack" autocomplete="off">
      <input id="join-code" maxlength="6" placeholder="CODE" required>
      <input id="join-name" maxlength="14" placeholder="NAME" required>
      <button class="btn btn-primary" type="submit">Join</button>
      <button id="btn-back" class="btn btn-ghost" type="button">Back</button>
    </form>
    <p id="msg-join" class="msg"></p>
  </main>

  <script type="module" src="js/lobby.js"></script>
  <script type="module">import { mountDecor } from './js/pixelDecor.js'; mountDecor();</script>
</body>
</html>
